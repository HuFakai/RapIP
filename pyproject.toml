[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rapip"
version = "0.2.1"
description = "A stateful SOCKS5 gateway with a private operations console"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "aiohttp>=3.11,<4",
    "aiosqlite>=0.20,<1",
    "python-dotenv>=1,<2",
    "python-socks[asyncio]>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[project.scripts]
rapip = "rapip.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rapip"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
